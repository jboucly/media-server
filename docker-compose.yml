version: "3.8"

services:
  # --- VPN MULLVAD (GLUETUN) ---
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - 8080:8080 # Interface web de qBittorrent
      - 6881:6881 # Port Torrent TCP
      - 6881:6881/udp # Port Torrent UDP
      - 5030:5030 # Interface web de slskd
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_WIREGUARD_ADDRESS}
      - SERVER_COUNTRIES=Switzerland
      - TZ=Europe/Paris
    restart: unless-stopped

  # --- 2. QBITTORRENT (Tout passe par le VPN) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun" # Utilise le réseau chiffré de Gluetun
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - WEBUI_PORT=8080
    volumes:
      - qbittorrent_config:/config
      - /mnt/media:/media
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # --- 3. CLOUDFLARE TUNNEL (Accès distant sécurisé pour plexamp) ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  # --- 4. MEDIA SERVER : PLEX (Base pour Plexamp) ---
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    network_mode: host # Indispensable pour la découverte réseau locale et les performances
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - plex_config:/config
      - /mnt/media:/media
    restart: unless-stopped

  # --- 5. AUTOMATISATION (ARR STACK) ---

  # --- SONARR (Séries) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - 8989:8989
    volumes:
      - sonarr_config:/config
      - /mnt/media:/media
    restart: unless-stopped

  # --- RADARR (Films) ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - 7878:7878
    volumes:
      - radarr_config:/config
      - /mnt/media:/media
    restart: unless-stopped

  # --- LIDARR (Gestion automatique de la musique & discographies) ---
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - 8686:8686
    volumes:
      - lidarr_config:/config
      - /mnt/media:/media
    restart: unless-stopped

  # --- PROWLARR (Gestionnaire d'indexeurs/Trackers) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    ports:
      - 9696:9696
    volumes:
      - prowlarr_config:/config
    restart: unless-stopped

  # --- 6. MUSIQUE A LA DEMANDE : PICKARR + SLSKD ---

  # --- SLSKD (Client Soulseek, passe par le VPN comme qBittorrent) ---
  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    network_mode: "service:gluetun"
    user: "1000:1000"
    environment:
      - TZ=Europe/Paris
      - SLSKD_REMOTE_CONFIGURATION=false
      - SLSKD_SLSK_USERNAME=${SLSKD_SLSK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SLSKD_SLSK_PASSWORD}
      - SLSKD_USERNAME=${SLSKD_WEB_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASSWORD}
      - SLSKD_API_KEY=${SLSKD_API_KEY}
      # incomplete et downloads sur le même volume : renommage au lieu de copie
      - SLSKD_DOWNLOADS_DIR=/media/downloads/soulseek
      - SLSKD_INCOMPLETE_DIR=/media/downloads/soulseek-incomplete
      - SLSKD_SHARED_DIR=/media/Musiques
    volumes:
      - /opt/appdata/slskd:/app
      - /mnt/media:/media
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # --- PICKARR (Lien Spotify/YouTube/SoundCloud -> bibliothèque musicale Plex) ---
  pickarr:
    image: registry.gitlab.com/dhmetha/pickarr:unetha
    container_name: pickarr
    user: "1000:1000"
    extra_hosts:
      - host.docker.internal:host-gateway # Plex est en network_mode host
    ports:
      - 8090:8080
    environment:
      - TZ=Europe/Paris
      - Pickarr__Password=${PICKARR_PASSWORD}
      - Pickarr__ApiKey=${PICKARR_API_KEY}
      - Pickarr__Soulseek__Url=http://gluetun:5030
      - Pickarr__Soulseek__ApiKey=${SLSKD_API_KEY}
      - Pickarr__Soulseek__DownloadsPath=/soulseek
      - Pickarr__Plex__Url=http://host.docker.internal:32400
      - Pickarr__Plex__Token=${PLEX_TOKEN}
      - Pickarr__Plex__LibraryPathInPlex=/media/Musiques/pickarr # le dossier tel que Plex le voit
      - Pickarr__LastFm__ApiKey=${LASTFM_API_KEY}
      - Pickarr__Discogs__Token=${DISCOGS_TOKEN}
    volumes:
      - /opt/appdata/pickarr:/data
      - /mnt/media/Musiques/pickarr:/music
      - /mnt/media/downloads/soulseek:/soulseek
    depends_on:
      - slskd
    restart: unless-stopped

  # --- 7. DECOUVERTES DE LA SEMAINE ---

  # --- PICKARR-DISCOVERY (2e instance de pickarr qui écrit uniquement dans Musiques/Decouvertes) ---
  # A retirer le jour où pickarr saura écrire dans un sous-dossier (voir PICKARR_SUBFOLDER).
  pickarr-discovery:
    image: registry.gitlab.com/dhmetha/pickarr:unetha
    container_name: pickarr-discovery
    user: "1000:1000"
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - TZ=Europe/Paris
      - Pickarr__Password=${PICKARR_PASSWORD}
      - Pickarr__ApiKey=${DISCOVERY_PICKARR_API_KEY}
      - Pickarr__Soulseek__Url=http://gluetun:5030
      - Pickarr__Soulseek__ApiKey=${SLSKD_API_KEY}
      - Pickarr__Soulseek__DownloadsPath=/soulseek
      - Pickarr__Plex__Url=http://host.docker.internal:32400
      - Pickarr__Plex__Token=${PLEX_TOKEN}
      - Pickarr__Plex__LibraryPathInPlex=/media/Musiques/Decouvertes
      - Pickarr__LastFm__ApiKey=${LASTFM_API_KEY}
      - Pickarr__Discogs__Token=${DISCOGS_TOKEN}
    volumes:
      - /opt/appdata/pickarr-discovery:/data
      - /mnt/media/Musiques/Decouvertes:/music
      - /mnt/media/downloads/soulseek:/soulseek
    depends_on:
      - slskd
    restart: unless-stopped

  # --- DISCOVERR (Last.fm -> pickarr-discovery -> playlist Plex, ménage des titres non aimés) ---
  discoverr:
    image: ghcr.io/jboucly/discoverr:latest
    container_name: discoverr
    user: "1000:1000"
    init: true # node en PID 1 ignore SIGTERM : arrêt immédiat au redéploiement
    extra_hosts:
      - host.docker.internal:host-gateway # Plex est en network_mode host
    ports:
      - 8091:3000 # Interface web
    # Secrets, URLs et chemins uniquement : planification, profils, notifications… se règlent dans l'interface.
    environment:
      - TZ=Europe/Paris
      - DISCOVERR_PASSWORD=${DISCOVERR_PASSWORD}
      - DISCOVERR_API_KEY=${DISCOVERR_API_KEY}
      - LASTFM_API_KEY=${LASTFM_API_KEY}
      - PICKARR_URL=http://pickarr-discovery:8080
      - PICKARR_API_KEY=${DISCOVERY_PICKARR_API_KEY}
      - PICKARR_SUBFOLDER=
      - PICKARR_LIBRARY_SUBDIR=Decouvertes
      - PLEX_URL=http://host.docker.internal:32400
      - PLEX_TOKEN=${PLEX_TOKEN}
      - MUSIC_ROOT=/music
      - PLEX_MUSIC_ROOT=/media/Musiques
      - DISCOVERY_SUBDIR=Decouvertes
      # Premier démarrage seulement : profil « Moi » créé avec ce compte, et mode simulation activé.
      - LASTFM_USER=${LASTFM_USER}
      - DRY_RUN=${DISCOVERR_DRY_RUN:-true}
    volumes:
      - /opt/appdata/discoverr:/data
      - /mnt/media/Musiques:/music
    depends_on:
      - pickarr-discovery
    restart: unless-stopped

volumes:
  plex_config:
  lidarr_config:
  qbittorrent_config:
  sonarr_config:
  radarr_config:
  prowlarr_config:
